apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: multiplayer-quiz
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/DAVIDRGODWIN/multiplayer-quiz
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: quiz
  syncPolicy:
    automated:
      prune: true       # delete resources removed from Git
      selfHeal: true    # revert manual cluster changes back to Git state
    syncOptions:
      - CreateNamespace=true
